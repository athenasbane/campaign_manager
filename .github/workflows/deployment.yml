# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  pull_request:
    types: [closed]
    branches: ["main"]

jobs:
  if_merged:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: "us-east-1"
      REACT_APP_CONTENTFUL_ACCESS_TOKEN: ${{ secrets.REACT_APP_CONTENTFUL_ACCESS_TOKEN }}
      REACT_APP_CONTENTFUL_CMA_ACCESS_TOKEN: ${{ secrets.REACT_APP_CONTENTFUL_CMA_ACCESS_TOKEN }}
      REACT_APP_CONTENTFUL_ENVIRONMENT: ${{ secrets.REACT_APP_CONTENTFUL_ENVIRONMENT }}
      REACT_APP_CONTENTFUL_PREVIEW_ACCESS_TOKEN: ${{ secrets.REACT_APP_CONTENTFUL_PREVIEW_ACCESS_TOKEN }}
      REACT_APP_CONTENTFUL_SPACE_ID: ${{ secrets.REACT_APP_CONTENTFUL_SPACE_ID }}
      REACT_APP_COGNITO_USER_POOL_ID: ${{ secrets.REACT_APP_COGNITO_USER_POOL_ID }}
      REACT_APP_COGNITO_CLIENT_ID: ${{ secrets.REACT_APP_COGNITO_CLIENT_ID }}
      REACT_APP_PLAYER_API_URL: ${{ secrets.REACT_APP_PLAYER_API_URL }}
      REACT_APP_CAMPAIGN_API_URL: "https://jqco73giv8.execute-api.eu-west-2.amazonaws.com"

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "yarn"
      - run: yarn install --frozen-lockfile
      - name: Build and deploy the durable Luxtria API
        run: |
          node scripts/build-luxtria-lambda.mjs
          aws lambda update-function-code --function-name luxtria-campaign-api --zip-file fileb://.local/luxtria-lambda.zip --region eu-west-2 --query LastModified --output text
          aws lambda wait function-updated --function-name luxtria-campaign-api --region eu-west-2
      - name: Verify the live API before deploying the player frontend
        run: |
          node --input-type=module -e 'const r = await fetch(process.env.REACT_APP_CAMPAIGN_API_URL + "/api/campaigns/luxtria/maps/luxtria"); const map = await r.json(); if (!r.ok || map.mapId !== "luxtria" || !Array.isArray(map.features) || map.features.length < 16) throw new Error("Live Luxtria API is not ready");'
      - run: yarn build
      - run: yarn sync
      - run: yarn invalidate
